name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The Go client and wire live in sibling repos; CI checks them out next
      # to this one, as in local development.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: payam-foundation/dotvpn-wire
          path: dotvpn-wire
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - name: go side
        run: |
          # Local replace points at ../dotvpn-wire; layout above satisfies it.
          make vet CLIENT=$GITHUB_WORKSPACE/dotvpn-client
      - name: app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: make apk CLIENT=$GITHUB_WORKSPACE/dotvpn-client && ./gradlew --no-daemon testDebugUnitTest

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: payam-foundation/dotvpn-wire
          path: dotvpn-wire
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # Keystore comes from a secret and lives only in the runner's temp dir.
      - name: sign and build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          KS_B64: ${{ secrets.DOTVPN_KEYSTORE_B64 }}
          DOTVPN_KEYSTORE_PASSWORD: ${{ secrets.DOTVPN_KEYSTORE_PASSWORD }}
          DOTVPN_KEY_ALIAS: ${{ secrets.DOTVPN_KEY_ALIAS }}
          DOTVPN_KEY_PASSWORD: ${{ secrets.DOTVPN_KEY_PASSWORD }}
        run: |
          export DOTVPN_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$DOTVPN_KEYSTORE"
          make release CLIENT=$GITHUB_WORKSPACE/dotvpn-client
          cp app/build/outputs/apk/release/*.apk dotvpn.apk
          sha256sum dotvpn.apk > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          rm -f "$DOTVPN_KEYSTORE"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dotvpn.apk checksums.txt checksums.txt.sigstore.json --generate-notes
