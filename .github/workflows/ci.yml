name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go client lives in a sibling repo; CI checks it out next to this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - name: go side
        run: |
          make vet CLIENT=$GITHUB_WORKSPACE/dotvpn-client
      - name: app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: make apk check-16kb CLIENT=$GITHUB_WORKSPACE/dotvpn-client && ./gradlew --no-daemon testDebugUnitTest

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write # keyless cosign signature
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keystore comes from a secret and lives only in the runner's temp dir.
      # Without it the build still succeeds, debug-signed, so forks and fresh
      # setups get a working APK; add the secrets and the next tag is release-signed.
      - name: release key
        id: key
        env:
          KS_B64: ${{ secrets.DOTVPN_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.DOTVPN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOTVPN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOTVPN_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore secrets not set: publishing a debug-signed APK. It cannot upgrade a release-signed install."
          fi
      - name: build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          DOTVPN_KEYSTORE_PASSWORD: ${{ secrets.DOTVPN_KEYSTORE_PASSWORD }}
          DOTVPN_KEY_ALIAS: ${{ secrets.DOTVPN_KEY_ALIAS }}
          DOTVPN_KEY_PASSWORD: ${{ secrets.DOTVPN_KEY_PASSWORD }}
          # Opt-in crash reporting DSN → BuildConfig.SENTRY_DSN (empty if unset).
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            export DOTVPN_KEYSTORE="$RUNNER_TEMP/release.jks"
            make release release-aab CLIENT=$GITHUB_WORKSPACE/dotvpn-client
            cp app/build/outputs/apk/release/*.apk dotvpn.apk
            cp app/build/outputs/bundle/release/*.aab dotvpn.aab
            sha256sum dotvpn.apk dotvpn.aab > checksums.txt
          else
            make apk CLIENT=$GITHUB_WORKSPACE/dotvpn-client
            cp app/build/outputs/apk/debug/*.apk dotvpn-debugsigned.apk
            sha256sum dotvpn-debugsigned.apk > checksums.txt
          fi
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - env:
          GH_TOKEN: ${{ github.token }}
        # release-please already created the release; attach the artifacts.
        run: gh release upload "$GITHUB_REF_NAME" dotvpn*.apk dotvpn*.aab checksums.txt checksums.txt.sigstore.json --clobber
      # Google Play: internal track until you promote it in the Play Console. The
      # first upload of a new app must be done by hand there; check targetSdk
      # against Play's current requirement before the first submission.
      - name: play upload
        if: steps.key.outputs.signed == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dot.vpn.payam
          releaseFiles: dotvpn.aab
          track: internal
          status: completed
