name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go client lives in a sibling repo; CI checks it out next to this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - name: go side
        run: |
          make vet CLIENT=$GITHUB_WORKSPACE/dotvpn-client
      - name: app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: make apk CLIENT=$GITHUB_WORKSPACE/dotvpn-client && ./gradlew --no-daemon testDebugUnitTest

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: payam-foundation/dotvpn-client
          path: dotvpn-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dotvpn-client/go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keystore comes from a secret and lives only in the runner's temp dir.
      - name: sign and build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          KS_B64: ${{ secrets.DOTVPN_KEYSTORE_B64 }}
          DOTVPN_KEYSTORE_PASSWORD: ${{ secrets.DOTVPN_KEYSTORE_PASSWORD }}
          DOTVPN_KEY_ALIAS: ${{ secrets.DOTVPN_KEY_ALIAS }}
          DOTVPN_KEY_PASSWORD: ${{ secrets.DOTVPN_KEY_PASSWORD }}
        run: |
          export DOTVPN_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$DOTVPN_KEYSTORE"
          make release CLIENT=$GITHUB_WORKSPACE/dotvpn-client
          cp app/build/outputs/apk/release/*.apk dotvpn.apk
          sha256sum dotvpn.apk > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          rm -f "$DOTVPN_KEYSTORE"
      - env:
          GH_TOKEN: ${{ github.token }}
        # release-please already created the release; attach the signed artifacts.
        run: gh release upload "$GITHUB_REF_NAME" dotvpn.apk checksums.txt checksums.txt.sigstore.json --clobber
